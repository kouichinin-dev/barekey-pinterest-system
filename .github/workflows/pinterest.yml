name: Pinterest Daily Publish
on:
  schedule:
    - cron: "30 0 * * *"  # UTC 00:30 — 每天触发一次，脚本内部随机决定当天发几条、什么时间发
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install boto3 requests Pillow
      - name: Publish Pinterest pin
        env:
          R2_ENDPOINT:                  ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY:                ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY:                ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET:                    ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL:                "https://pub-f38f66bcaab742dfb6263106bb8c6142.r2.dev"
          DEEPSEEK_API_KEY:             ${{ secrets.DEEPSEEK_API_KEY }}
          QWEN_API_KEY:                ${{ secrets.QWEN_API_KEY }}
          BUFFER_ACCESS_TOKEN:          ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_PINTEREST_CHANNEL_ID:  "6a294b178f1d11f9b26fc257"
          MAIL_163_USER:                ${{ secrets.MAIL_163_USER }}
          MAIL_163_PASS:                ${{ secrets.MAIL_163_PASS }}
        run: |
          cd pinterest/scripts
          python publish.py
